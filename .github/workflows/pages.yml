# Publie la version web du jeu sur GitHub Pages à chaque push sur main (on y fusionne develop pour publier).
# Réglage unique du dépôt : Settings > Pages > Source : GitHub Actions.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # sharp et ffmpeg-static convertissent images et sons au build.
      # Electron n'est pas utile ici : on saute le téléchargement de son binaire.
      - name: Installer les outils de build
        run: npm ci --no-audit --no-fund
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      - name: Construire le site
        run: node tools/build-web.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
