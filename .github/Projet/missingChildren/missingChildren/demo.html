<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Démo — Terminal &amp; Lore caché</title>
<link rel="stylesheet" href="retro-terminal.css" />
<style>
    body{
        margin:0;
        min-height:100vh;
        background:#0b0b0b;
        color:#ccc;
        font-family:Consolas, "Courier New", monospace;
        display:flex;
        flex-direction:column;
        align-items:center;
        justify-content:center;
        gap:24px;
        padding:40px 20px;
        box-sizing:border-box;
    }

    h1{
        color:#00ff66;
        text-shadow:0 0 10px rgba(0,255,102,.6);
        font-size:20px;
        letter-spacing:1px;
        margin:0;
        text-align:center;
    }

    .panel{
        border:1px solid #2a2a2a;
        background:#0f0f0f;
        padding:20px 24px;
        border-radius:4px;
        display:flex;
        flex-direction:column;
        gap:14px;
        width:min(420px, 90vw);
    }

    .row{
        display:flex;
        align-items:center;
        justify-content:space-between;
        gap:10px;
    }

    label{
        font-size:13px;
        color:#999;
    }

    select, button{
        background:#1a1a1a;
        color:#00ff66;
        border:1px solid #2a2a2a;
        padding:8px 10px;
        font-family:inherit;
        font-size:13px;
        border-radius:3px;
        cursor:pointer;
    }

    select:hover, button:hover{
        border-color:#00ff66;
    }

    #open-btn{
        background:#062b16;
        border-color:#00ff66;
        padding:12px;
        font-size:14px;
    }

    #reset-btn{
        color:#ff8585;
        border-color:#3a1a1a;
    }

    #reset-btn:hover{
        border-color:#ff5050;
    }

    .hint{
        font-size:11px;
        color:#666;
        line-height:1.5;
        text-align:center;
    }
</style>
</head>
<body>

    <h1>FAZBEAR ENTERTAINMENT<br>SECURITY TERMINAL — DÉMO</h1>

    <div class="panel">

        <div class="row">
            <label for="night-select">Nuit simulée</label>
            <select id="night-select">
                <option value="1">Nuit 1</option>
                <option value="2">Nuit 2</option>
                <option value="3">Nuit 3</option>
                <option value="4">Nuit 4</option>
                <option value="5">Nuit 5</option>
                <option value="6">Nuit 6</option>
                <option value="7">Nuit 7</option>
            </select>
        </div>

        <button id="open-btn">▶ OUVRIR LE TERMINAL</button>

        <button id="reset-btn">✕ Réinitialiser la progression</button>

        <p class="hint">
            Tape <strong>HELP</strong> dans le terminal pour la liste publique.<br>
            Les commandes cachées (LOGS, STAFF, ARCHIVE, GUESTS, REPORT,
            LOST, LUCAS, EMPLOYEE_17, DRAWINGS, PRESS, ROOT...) ne sont
            pas listées — elles dépendent de la nuit choisie ci-dessus.
        </p>

    </div>

    <script>
        /* ============================================================
           MOCKS — remplace ces objets par les vrais systèmes du jeu
           une fois ce fichier intégré au projet complet.
           ============================================================ */

        function playSound(name) {
            console.log("[son]", name);
        }

        const currentNight = {
            number: 1
        };

        document.getElementById("night-select")
            .addEventListener("change", e => {
                currentNight.number = parseInt(e.target.value, 10);
            });
    </script>

    <script src="retroTerminal.js"></script>
    <script src="lore-secrets.js"></script>

    <script>
        document.getElementById("open-btn")
            .addEventListener("click", () => {

                RetroTerminal.shell({
                    title: "ARCHIVES — ACCÈS NON RÉFÉRENCÉ",
                    intro: "Connexion établie...\nTapez HELP pour les commandes publiques.",
                    onCommand: raw => LoreSecrets.handleCommand(raw)
                });
            });

        document.getElementById("reset-btn")
            .addEventListener("click", () => {
                LoreSecrets.resetProgress();
                alert("Progression réinitialisée.");
            });
    </script>

</body>
</html>
