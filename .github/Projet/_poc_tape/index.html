<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Scène — Lecteur de cassettes</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <!--
    Scène "lecteur de cassettes"
    ----------------------------
    Cette scène est autonome : elle est masquée par défaut (hidden)
    et pilotée uniquement via les fonctions publiques loadTapeScene()
    et closeTapeScene() exposées par script.js.

    Aucune logique n'est écrite ici : uniquement de la structure.
  -->
  <section id="tape-scene" class="tape-scene" hidden aria-hidden="true">

    <!-- Bureau du gardien de nuit : couloir sombre, plafonnier globe,
         moniteurs de surveillance, ventilateur, panneau de notes. -->
    <div class="scene-room">

      <!-- Couloirs latéraux plongés dans le noir -->
      <div class="doorway doorway-left" aria-hidden="true"><div class="cobweb cobweb-tl"></div></div>
      <div class="doorway doorway-right" aria-hidden="true"><div class="cobweb cobweb-tr"></div></div>

      <!-- Unique source de lumière : le plafonnier globe -->
      <div class="ceiling-lamp" aria-hidden="true">
        <div class="lamp-cord"></div>
        <div class="lamp-globe"></div>
        <div class="lamp-glow"></div>
      </div>

      <!-- Câbles qui pendent du plafond -->
      <div class="hanging-wires" aria-hidden="true">
        <span></span><span></span><span></span><span></span><span></span>
      </div>

      <!-- Mur du fond : panneau de notes du gardien -->
      <div class="wall-board" aria-hidden="true">
        <div class="board-note note-1"></div>
        <div class="board-note note-2"></div>
        <div class="board-note note-3"></div>
        <div class="board-note note-4"></div>
        <div class="board-note note-5"></div>
      </div>

      <div class="desk">

        <!-- Moniteur de surveillance gauche (décor) -->
        <div class="crt-monitor crt-left" aria-hidden="true">
          <div class="crt-screen"><div class="crt-scanline"></div></div>
        </div>

        <!-- Étagère à cassettes : remplie dynamiquement par script.js -->
        <div class="tape-rack" id="tape-rack" aria-label="Cassettes disponibles">
          <!-- .tape-card générées en JS -->
        </div>

        <!-- Lecteur de cassettes -->
        <div class="player" id="tape-player" data-state="EMPTY">

          <div class="player-shell">

            <div class="player-vents" aria-hidden="true"></div>

            <!-- Bobines visibles à travers la vitre -->
            <div class="player-window">
              <div class="reel reel-left" id="reel-left"></div>
              <div class="reel reel-right" id="reel-right"></div>
            </div>

            <!-- Zone de dépôt : seule zone valide pour le Drag & Drop -->
            <div class="player-slot" id="player-slot">
              <div class="slot-opening"></div>
              <div class="slot-hint">INSÉRER LA BANDE</div>
              <!-- La cassette insérée est déplacée ici dynamiquement -->
            </div>

            <div class="player-panel">
              <span class="led led-red" id="led-red" title="Absence de bande"></span>
              <span class="led led-green" id="led-green" title="Bande prête"></span>

              <button type="button" class="ctrl-btn ctrl-play" id="btn-play" disabled>
                <span class="ctrl-icon">▶</span><span class="ctrl-text">PLAY</span>
              </button>
              <button type="button" class="ctrl-btn ctrl-stop" id="btn-stop" disabled>
                <span class="ctrl-icon">■</span><span class="ctrl-text">STOP</span>
              </button>
            </div>
          </div>

          <div class="player-plate">MODÈLE VX-90 · REC / PLAY</div>
        </div>

        <!-- Ventilateur de bureau (décor, tourne en continu) -->
        <div class="desk-fan" aria-hidden="true">
          <div class="fan-cage">
            <div class="fan-blades"></div>
            <div class="fan-hub"></div>
          </div>
          <div class="fan-stand"></div>
        </div>

        <!-- Moniteur de surveillance droit (décor) -->
        <div class="crt-monitor crt-right" aria-hidden="true">
          <div class="crt-screen"><div class="crt-scanline"></div></div>
        </div>

        <!-- Gobelet oublié sur le bureau -->
        <div class="desk-cup" aria-hidden="true"></div>
      </div>

      <!-- Sol en damier, à la limite du champ de vision -->
      <div class="floor-checker" aria-hidden="true"></div>

      <div class="scene-vignette" aria-hidden="true"></div>
      <div class="scene-grain" aria-hidden="true"></div>
    </div>

    <button type="button" class="scene-close" id="scene-close" aria-label="Fermer la scène">✕</button>
  </section>

  <script src="script.js"></script>
</body>
</html>
