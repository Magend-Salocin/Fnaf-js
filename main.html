<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FNAF 1 - Nicolas Berger</title>
  <link rel="stylesheet" href="style/style.css">
  <link rel="stylesheet" href="style/camera.css">
</head>
<body>


  	<!-- transition -->
	<div class="transition">
		<img src="images/game/transition_screen.png" alt="">
		<h2 class="display-0" id="transition-start">12:00 AM</h2>
		<h2 class="display-0" id="transition-night">Night <span id="night-count">1</span></h2>
	</div>

  	<!-- preloader -->
	<div class="preloader">
		<h1>Five Nights at Freddy's 1</h1>
        <img src="images/game/preloader.png" alt="">
    </div>
	
	<div id="__game" class="display-0">

		<div id="camera-bg2"><img src="" alt="" class="display-0"></div>
	

		<!-- controls -->
		<div id="controls">

			<!-- cameraLayout -->
			<div id="cameraLayout">
					<div class="map-container" id="camLayoutContainer">
						<!-- Pièces -->
						<div class="room Dining-Area">Dining Area</div>
						<div class="room Backstage">Backstage</div>
						<div class="room Showstage">Showstage</div>
						<div class="room Office" id ="camsafe">Office</div>
						<div class="room Pirate-Cove">Pirate Cove</div>
						<div class="room Supply-Closet">Supply Closet</div>
						<div class="room Rest-Room">Rest Room</div>
						<div class="room Rest-Room-water-closet-h"></div>
						<div class="room Rest-Room-water-closet-f"></div>
						<div class="room Kitchen">Kitchen</div>
						<div class="room West-Hall">West Hall</div>
						<div class="room East-Hall">East Hall</div>
						<!-- Caméras -->
						<div class="camera cam-1a" id="cam1a" >Cam 1A</div>
						<div class="camera cam-1b" id="cam1b" >Cam 1B</div>
						<div class="camera cam-1c" id="cam1c" >Cam 1C</div>
						<div class="camera cam-2a" id="cam2a">Cam 2A</div>
						<div class="camera cam-2b" id="cam2b" >Cam 2B</div>
						<div class="camera cam-3" id="cam3" >Cam 3A</div>
						<div class="camera cam-4a" id="cam4a" >Cam 4A</div>
						<div class="camera cam-4b" id="cam4b" >Cam 4B</div>
						<div class="camera cam-5" id="cam5" >Cam 5A</div>
						<div class="camera cam-6" id="cam6" >Cam 6A</div>
						<div class="camera cam-7" id="cam7" >Cam 7A</div>
						<div  id="you" ></div>
					</div>
			</div>
		
			<!-- doorButtons -->
			<div id="doorButtons" style="width: 100%;    position: fixed;z-index: 4;">
				<button id="leftDoor">Porte Gauche (Fermée)</button>
				<button id="rightDoor">Porte Droite (Fermée)</button>
				<button id="leftLight">Lumière Gauche (OFF)</button>
				<button id="rightLight">Lumière Droite (OFF)</button>
				<button id="start">start</button>
				<button id="toggleCameraLayout">CAM</button>
			</div>

		</div>

		<canvas id="gameCanvas" ></canvas>
		<div id="powerUsage">Puissance : 100%</div>

		<div id="gameOver" style="display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: red; font-size: 48px;">GAME OVER</div>
	</did>


	<!-- audios -->
	<div id="audios">
		<audio preload="auto" class="camera-toggle"   src="audio/CAMERA_VIDEO_LOA_60105303.wav"></audio>
		<audio preload="auto" class="camera-put-down" src="audio/put down.wav"></audio>
		<audio preload="auto" class="ambience2"   src="audio/ambience2.wav"></audio>
		<audio preload="auto" class="Buzz-fan"   src="audio/Buzz_Fan_Florescent2.wav"  loop="loop" volume="0.1" ></audio>

		<audio preload="auto" id="game-start" src="audio/Buzz_Fan_Florescent2.wav" loop="loop" volume="0.1"></audio>
		<audio preload="auto" id="call1" src="audio/voiceover1.wav"></audio>
		<audio preload="auto" id="call2" src="audio/voiceover2.wav"></audio>
		<audio preload="auto" id="call3" src="audio/voiceover3.wav"></audio>
		<audio preload="auto" id="call4" src="audio/voiceover4.wav"></audio>
		<audio preload="auto" id="call5" src="audio/voiceover5.wav"></audio>
		<audio preload="auto" id="ambience2" src="audio/ambience2.wav" loop="loop" volume="0.5"></audio>
		<audio preload="auto" id="window-scare" src="audio/windowscare.wav"></audio>
		<audio preload="auto" id="scare" src="audio/XSCREAM.wav"></audio>
		<audio preload="auto" id="powerout-sound" src="audio/powerdown.wav"></audio>
		<audio preload="auto" id="powerout-jingle" src="audio/music box.wav" loop="loop"></audio>
		<audio preload="auto" id="gameover-static" src="audio/static.wav"></audio>
		<audio preload="auto" id="move-sound" src="audio/deep steps.wav"></audio>
		<audio preload="auto" id="win-sound" src="audio/chimes 2.wav"></audio>
		<audio preload="auto" id="win-cheer" src="audio/CROWD_SMALL_CHIL_EC049202.wav"></audio>
		<audio preload="auto" id="kitchen-b" src="audio/OVEN-DRA_1_GEN-HDF18119.wav"></audio>
		<audio preload="auto" id="kitchen-c" src="audio/OVEN-DRA_2_GEN-HDF18120.wav"></audio>
		<audio preload="auto" id="kitchen-f" src="audio/OVEN-DRA_7_GEN-HDF18121.wav"></audio>
		<!-- Left Door Switch-->
		<audio preload="auto" class="light-on" src="audio/BallastHumMedium2.wav"></audio>
		<audio preload="auto" class="door-sound" src="audio/SFXBible_12478.wav"></audio>
		<audio preload="auto" class="door-light-disabled" src="audio/error.wav"></audio>

		<!-- camera map -->
		<audio preload="auto" class="camera-cycle" src="audio/blip3.wav"></audio>
	</div>

	<!-- script -->
	<div id="script">
		<script src="script/sounds.js"></script>	
		<script src="script/data.js"></script>
		<script src="script/assets.js"></script>
		<script src="script/animatronic.js"></script>
		<script src="script/render.js"></script>
		<script src="script/game.js"></script>
		<script src="script/main.js"></script>
	</div>
</body>
</html>
