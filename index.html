<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Five Night at Freddy's</title>
    <link href="https://fonts.googleapis.com/css?family=Press+Start+2P&subset=latin,greek" rel="stylesheet" type="text/css">
    <link rel="stylesheet" href="style/start-screen.css">
</head>
<body>
    <div class="container" id="start-screen">
        <div class="static"></div>
        <div class="start">
            <audio preload="auto" id="menu-start" src="audio/darkness_music.wav" loop="loop"></audio>
            <aside class="menu">
                <h1>Five<br> Night <br>at<br> Freddy's</h1>
                <a href="main.html" id="start-game" onclick="javascript:night=1;">Start Game</a>
                
            </aside>
        </div>
    </div>



    <script>
        // Chargement des scripts dans l'ordre
document.addEventListener('click', function() {
    const menuStart = document.querySelector('#menu-start');
    if (menuStart) {
        menuStart.play().catch(e => console.error("Erreur de lecture :", e));
    }
    // Supprimer l'événement après la première interaction
    document.removeEventListener('click', arguments.callee);
}, { once: true });

</body>
</html>
